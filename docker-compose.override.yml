# Local staging / dev overrides (the "docker-compose.dev.yml" of
# docs/specs/01-architecture-and-deployment.md).
#
# Named docker-compose.override.yml rather than docker-compose.dev.yml because
# Compose auto-loads this filename, and that is what makes the spec's own
# documented commands work:
#
#   docker compose run --rm app go test ./...
#
# The production `app` image is FROM scratch and contains no Go toolchain, so
# that command can only run against the dev target. Auto-loading the override
# is what puts the dev target under the `app` name locally. Production is
# unaffected because it pins the base file explicitly:
#
#   docker compose -f docker-compose.yml up -d
#
# (The Synology NAS pins two files instead - docker-compose.yml and
# docker-compose.nas.yml - on every call; see the "Synology NAS variant" section
# of docs/specs/01-architecture-and-deployment.md.)

services:
  app:
    build:
      context: .
      target: dev
    # A distinct tag: both targets otherwise export to inventory-app:latest,
    # and whichever was built last would win — silently running the scratch
    # image (which has no Go toolchain) for `docker compose run --rm app
    # go test ./...`.
    image: inventory-app-dev
    environment:
      - APP_ENV=dev
      - STATIC_DIR=/src/web/static
    volumes:
      - ./web:/src/web          # edit frontend files, just refresh the browser
      - ./internal:/src/internal
      - ./cmd:/src/cmd
      # Without this, /src/migrations is whatever was baked into the image, so
      # a newly added migration is invisible to `docker compose run --rm app go
      # test ./...` until someone rebuilds — and the failure is a confusing
      # "relation does not exist" from a test suite that migrates its own
      # throwaway database, not an obvious "your migration is missing".
      - ./migrations:/src/migrations
    # Both sides read the same variable, not a fixed "8000:8000": the app
    # itself listens on $HTTP_PORT (internal/config/config.go), not a
    # hardcoded 8000, so the host and container sides must move together.
    # Concurrent checkouts (e.g. the wave orchestrator's per-package
    # worktrees, scripts/wellen-orchestrator.ps1) set a distinct HTTP_PORT
    # per worktree's .env precisely so `docker compose up` in two of them at
    # once does not fight over the same host port; the default here keeps a
    # single ordinary checkout working unchanged.
    ports:
      - "${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
