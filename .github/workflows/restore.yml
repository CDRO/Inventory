# The backup/restore round trip (docs/specs/15-backup-restore-and-export.md,
# issue #133): the first time that spec's restore procedure — and therefore
# spec 18's only rollback — is executed end to end rather than read.
#
# Moved out of e2e.yml into its own workflow (H8, decision D8 —
# docs/plans/2026-09-harness-optimization.md §9): it used to run on every
# push to `main` alongside the E2E suite, but only a narrow set of files can
# actually break it — the backup script, the compose layout, the migration-
# after-restore step, the fixtures it seeds — so gating it on those files
# (plus a periodic run, in case an unpinned image drifts under a tag nobody
# touched) turns ~140 min/month of "runs on every push" into a few minutes.
#
# Four triggers, all D8:
#   - `push` to `main`, path-filtered to the files that can break this job.
#   - `push` of a `v*` tag — this is the deployment gate spec 18 calls "the
#     only rollback", so it runs before a NAS deploy on every release,
#     regardless of which files changed (`paths` filters are not evaluated
#     for tag pushes, so this is unconditional on tags by construction, not
#     by a second trigger block).
#   - a weekly `schedule`, to catch drift in the `postgres`/Playwright images
#     this file references by tag rather than digest — no path filter can
#     see that.
#   - `workflow_dispatch`, the same on-demand escape hatch every other
#     workflow here has.
#
# Dispatch and poll it the same way e2e.yml documents:
#
#   git push -u origin <branch>
#   gh workflow run restore.yml --ref <branch>
#   SHA=$(git rev-parse HEAD)
#   RUN_ID=""
#   for i in $(seq 1 10); do
#     RUN_ID=$(gh run list --workflow=restore.yml --branch <branch> --event workflow_dispatch \
#       --limit 5 --json databaseId,headSha -q ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)
#     [ -n "$RUN_ID" ] && break
#     sleep 3
#   done
#   gh run watch "$RUN_ID" --exit-status
#
# This workflow builds its own copy of the production image rather than
# sharing e2e.yml's `build` job's artifact: the two are separate workflows
# with independent, mostly-non-overlapping triggers (this one runs on a
# small fraction of the pushes e2e.yml's build does), so there is no single
# run to hand the image off from. `cache-from: type=gha` still picks up
# whatever layer the OTHER workflow's builds already warmed (the `go mod
# download` layer, keyed on go.sum) — the GitHub Actions cache backend is
# shared across workflows in the same repository.
#
# Nothing here bypasses the no-host-toolchain rule: every command goes
# through `docker compose`, `docker buildx`, or plain shell utilities
# (`curl`, `diff`, `grep`) on the runner — no Go, Node, or Postgres installed
# directly. The Playwright browser runtime this workflow does NOT use at
# all; the round trip never touches the `e2e` service.
#
# Like e2e.yml, the steps below deliberately do NOT pass docker-compose.e2e
# .yml's `-p inventory-e2e` — see that workflow's header for why omitting it
# on a runner changes no behaviour.
name: restore-round-trip

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - scripts/backup
      - docker-compose*.yml
      - migrations/**
      - e2e/restore/**
      - e2e/fixtures/**
      - Dockerfile
  schedule:
    - cron: "17 3 * * 1" # every Monday, off the hour so it isn't fighting every other repo's cron for the same minute
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Created ahead of the first `docker compose run` that mounts them, so
      # they belong to the runner's own user rather than to root: Docker
      # creates a missing bind-mount source directory itself, as root, and the
      # steps below both read from and write into these two.
      - name: Make the archive and report directories
        run: mkdir -p backups e2e/test-results

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same tag e2e.yml's `build` job uses for the same target — Compose
      # would synthesize this tag itself for docker-compose.e2e.yml's `app`
      # service (that file's own header explains the project-name
      # precedence that makes this the answer on a runner with no `.env`).
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          tags: inventory-e2e-app:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Apply migrations
        run: docker compose -f docker-compose.e2e.yml run --rm app migrate up

      - name: Bring up the stack
        run: docker compose -f docker-compose.e2e.yml up -d

      # The same readiness proof e2e.yml's `e2e` job uses, and for the same
      # reason: `up -d` returns when containers started, not when the app can
      # serve. Here it doubles as the "before" half of the health assertion —
      # the stack that gets backed up is a stack that was demonstrably working.
      - name: Wait for the app to answer through Traefik
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/healthz || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "app never answered a 200 from /healthz" >&2
          docker compose -f docker-compose.e2e.yml logs app
          exit 1

      # ON_ERROR_STOP because a half-applied fixture would make the snapshot
      # below a snapshot of the wrong thing — and it would still round-trip
      # perfectly, which is the one way this job could pass while proving
      # nothing.
      - name: Seed fixtures
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -v ON_ERROR_STOP=1 -f /fixtures/seed.sql
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -v ON_ERROR_STOP=1 -f /fixtures/restore-roundtrip.sql

      # The setup half of spec 15's "all prior sessions are invalid". Asserted
      # here rather than in the snapshot because it is the one claim of the
      # restore that requires the two sides to *differ*: these rows must exist
      # now and be gone afterwards. Checked rather than assumed, so that a
      # fixture that silently stopped inserting them cannot turn the
      # after-check into 0 = 0 against a table nothing ever filled.
      - name: The instance carries sessions the restore must invalidate
        run: |
          before=$(docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -tAX -c "SELECT count(*) FROM sessions" | tr -d '[:space:]')
          if [ "$before" -lt 2 ]; then
            echo "expected the seeded browser and device sessions, found $before" >&2
            exit 1
          fi

      # An archive is db.sql *plus* the uploads tree, and a round trip that
      # checks only the database leaves half the contract untested — the half
      # holding the photos of the household's own shelves, which is the
      # irreplaceable half. One file is enough to tell "the tree came back"
      # from "the tree came back empty". It is written through the `backup`
      # service's writable /restore/uploads mount and read back afterwards
      # through its read-only /data/uploads one, so the assertion looks at the
      # tree from the side a backup actually reads.
      - name: Put a known file in the uploads tree
        run: |
          docker compose -f docker-compose.e2e.yml run --rm -T --entrypoint sh backup -c \
            'mkdir -p /restore/uploads/products && printf "restore round trip probe\n" > /restore/uploads/products/restore-probe.txt'

      # e2e/restore/snapshot.sql explains what it emits and why. `diff` and
      # `grep` here are in the same class as the `curl` and `seq` this file
      # already uses — shell utilities on the runner, not a language toolchain
      # anything is built or tested with (docs/specs/01-architecture-and-
      # deployment.md). Every command that touches the application or its
      # database still goes through `docker compose`.
      - name: Snapshot the instance that is about to be destroyed
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -tAX -v ON_ERROR_STOP=1 \
            < e2e/restore/snapshot.sql > e2e/test-results/before.txt
          cat e2e/test-results/before.txt
          if grep -q '<MISSING>' e2e/test-results/before.txt; then
            echo "a spot check named a row that does not exist before the backup;" >&2
            echo "fix the id in e2e/restore/snapshot.sql — comparing two absences proves nothing" >&2
            exit 1
          fi

      - name: Take the backup
        run: docker compose -f docker-compose.e2e.yml run --rm backup

      # Globbed rather than parsed out of the backup's own output: the script
      # names the archive after a UTC timestamp it picks itself. A partial
      # archive cannot be picked up by mistake — it is written under a
      # dot-prefixed .part name until tar has succeeded, and this glob does not
      # match it.
      - name: Find the archive
        run: |
          set -- backups/inventory-backup-*.tar.gz
          if [ "$#" != "1" ] || [ ! -f "$1" ]; then
            echo "expected exactly one archive in ./backups, found $#" >&2
            ls -la backups >&2
            exit 1
          fi
          echo "ARCHIVE=$(basename "$1")" >> "$GITHUB_ENV"

      # The real disaster, not a simulation of one: `down -v` removes the
      # database's data directory and the uploads volume with it. Everything
      # that is not in ./backups on the runner is gone after this step.
      #
      # The volume name is read off the running container rather than written
      # out as `inventory-e2e_uploads`, because the project name is not always
      # the one docker-compose.e2e.yml sets: COMPOSE_PROJECT_NAME takes
      # precedence over the file's `name:`, and an agent worktree's .env sets
      # it. Checking a name nothing uses would be a check that always passes.
      - name: Destroy the stack, volumes and all
        run: |
          uploads=$(docker inspect \
            -f '{{range .Mounts}}{{if eq .Destination "/data/uploads"}}{{.Name}}{{end}}{{end}}' \
            "$(docker compose -f docker-compose.e2e.yml ps -q app)")
          if [ -z "$uploads" ]; then
            echo "no uploads volume is mounted behind the app container" >&2
            exit 1
          fi
          docker compose -f docker-compose.e2e.yml down -v
          if docker volume inspect "$uploads" >/dev/null 2>&1; then
            echo "$uploads survived down -v; the restore below would prove nothing" >&2
            exit 1
          fi

      - name: Bring the database back up, on its own
        run: docker compose -f docker-compose.e2e.yml up -d db

      # The restore refuses to run against a database it cannot reach, and a
      # freshly destroyed volume means initdb has to run before this one
      # answers — the slowest case there is. `backup` deliberately has no
      # depends_on, so nothing else waits for it either.
      - name: Wait for the empty database to accept connections
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.e2e.yml exec -T db \
              pg_isready -U e2e -d e2e >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "the database never came back after down -v" >&2
          docker compose -f docker-compose.e2e.yml logs db
          exit 1

      # Without this the whole job could pass on a stack that was never
      # actually emptied. `to_regclass` answering NULL is the schema itself
      # being absent, not merely the rows.
      - name: Prove the database really is empty
        run: |
          empty=$(docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -tAX -c "SELECT to_regclass('public.users') IS NULL" | tr -d '[:space:]')
          if [ "$empty" != "t" ]; then
            echo "the users table still exists after down -v: nothing was destroyed" >&2
            exit 1
          fi

      - name: Restore from the archive
        run: docker compose -f docker-compose.e2e.yml run --rm backup restore "/backups/$ARCHIVE"

      # Step 4 of the documented procedure. A no-op when the dump's schema
      # version matches the binary's, which it does here — it is in the
      # sequence because leaving it out would test a procedure nobody follows.
      - name: Apply migrations newer than the backup
        run: docker compose -f docker-compose.e2e.yml run --rm app migrate up

      - name: Bring the restored stack up
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: The restored stack answers /healthz
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/healthz || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "the restored app never answered a 200 from /healthz" >&2
          docker compose -f docker-compose.e2e.yml logs app
          exit 1

      # The assertion the 200 above cannot make. A stack that serves requests
      # out of an empty database is a stack that answers /healthz perfectly.
      - name: The data came back, row for row and field for field
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -tAX -v ON_ERROR_STOP=1 \
            < e2e/restore/snapshot.sql > e2e/test-results/after.txt
          cat e2e/test-results/after.txt
          diff -u e2e/test-results/before.txt e2e/test-results/after.txt

      # The other half. scripts/backup deletes these after loading db.sql —
      # the one thing a restore does that is not replaying the dump — and a
      # restore that skipped it would hand back working cookies from before
      # the disaster. The dump demonstrably carried the rows, because the step
      # before the backup counted them.
      - name: Every session from the backed-up instance is gone
        run: |
          after=$(docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -tAX -c "SELECT count(*) FROM sessions" | tr -d '[:space:]')
          if [ "$after" != "0" ]; then
            echo "the restore left $after session(s) from the backed-up instance alive" >&2
            exit 1
          fi

      - name: The uploads tree came back too
        run: |
          probe=$(docker compose -f docker-compose.e2e.yml run --rm -T --entrypoint sh backup -c \
            'cat /data/uploads/products/restore-probe.txt' | tr -d '\r')
          if [ "$probe" != "restore round trip probe" ]; then
            echo "the uploads tree did not survive the round trip; got: $probe" >&2
            exit 1
          fi

      # Nobody can reproduce this job on a machine that is running anything
      # else out of docker-compose.e2e.yml, so a bare "diff failed" with no
      # files attached costs a whole CI cycle to read.
      - name: Upload the snapshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-round-trip-snapshots
          path: e2e/test-results
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
