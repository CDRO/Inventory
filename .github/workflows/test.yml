# Runs the project's own documented test commands
# (docs/specs/01-architecture-and-deployment.md) on GitHub-hosted runners.
#
# This exists because the sandboxes that some review/agent sessions run in
# cannot start a Docker daemon at all (missing CAP_NET_ADMIN — see issue #48),
# so `docker compose run --rm app go test ./...` has no environment to execute
# in locally. GitHub-hosted runners have a working Docker daemon, so this
# workflow is the fallback signal for those sessions when they ask for one.
#
# Triggered on `pull_request` **only when the base is `main`** - a wave
# consolidation PR (`integration/*` -> `main`) or any other PR that merges
# directly to `main` - not on a package PR (a feature branch against an
# integration branch), which is not merging to `main` yet and has already
# been reviewed by `review-tests` running the suite itself. This is a
# deliberate narrowing, made once a persisted Go build cache (see
# docker-compose.override.yml's `go-build-cache` volume) made a local run
# fast enough that running full CI automatically on every push to every one
# of a wave's several package PRs was pure cost for the common case: a local
# Docker daemon has been available in every session that has produced a PR
# on this project so far. `push: main` stays automatic too, as a backstop for
# a direct push that skips a PR entirely.
#
# The accepted trade-off is the one `e2e.yml` already makes for a different
# reason: a session with no local Docker reviewing a PACKAGE PR now has no
# automatic CI signal to fall back to (only the on-demand one below) - see
# `review-tests.md`'s own fallback recipe, which checks the PR's base branch
# and dispatches this workflow explicitly rather than assuming a
# PR-triggered run exists, for exactly that case. A PR against `main` is
# unaffected: `gh pr checks <PR>` finds the automatic run there as before.
#
# `workflow_dispatch` is the on-demand escape hatch for the case above, and
# for the earlier implementation loop, before a PR exists at all: a session
# with no local Docker can push a branch (with or without a PR yet) and ask
# for a signal on it directly. Two things `gh run watch` needs help with
# outside an interactive
# terminal (every agent session): it requires an explicit run id, and the run
# list can briefly still show only an older run from the same branch right
# after dispatch — so poll by the exact commit SHA under test, not just "the
# newest run", until a match for it shows up (`scripts/dev ci-status <sha>
# --dispatch <branch>` is this recipe as a command) —
#
#   git push -u origin <branch>
#   gh workflow run test.yml --ref <branch>
#   SHA=$(git rev-parse HEAD)
#   RUN_ID=""
#   for i in $(seq 1 10); do
#     RUN_ID=$(gh run list --workflow=test.yml --branch <branch> --event workflow_dispatch \
#       --limit 5 --json databaseId,headSha -q ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)
#     [ -n "$RUN_ID" ] && break
#     sleep 3
#   done
#   gh run watch "$RUN_ID" --exit-status
#
# — slower than a local `docker compose run`, but it keeps development
# possible end to end without a working local daemon.
#
# Nothing here bypasses the no-host-toolchain rule: every command still goes
# through `docker compose`, exactly as documented. `docker buildx` and
# `actions/cache` below are runner-side tooling, not a host toolchain — they
# move bytes into caches, they don't compile or run anything themselves. No
# Go, Node, or Postgres is installed on the runner directly.
#
# Everything above is about the `test` job. This workflow also carries a second,
# unrelated job, `runner-image` (H16, #315): it builds the self-hosted NAS
# runner's image and runs that image's own start-up smoke test, and it does so
# only on a commit that changed `deploy/synology/runner/**`. It lives here rather
# than in a workflow of its own because GitHub's path filters are per workflow,
# not per job, so its own file would have had to duplicate these triggers and
# the reasons for them; the trade-off is that a commit which is not about the
# runner still starts that job for a few seconds before it says so and builds
# nothing. Its own comment block, above the job, has the rest.
#
# A third, equally unrelated job, `agent-image` (H18, #317): builds the
# Claude Code agent runtime (deploy/agent/) and runs its doctor gate with
# neither the Docker socket nor any credentials mounted, only on a commit
# that changed `deploy/agent/**`. Same path-filter-as-a-step reason as
# `runner-image` above; its own comment block, above the job, has the rest.
name: test

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md", .claude/**, LICENSE]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**, "**.md", .claude/**, LICENSE]
  workflow_dispatch:
  # H17 (docs/specs/38-release-pipeline-and-nas-runner.md, "Trigger and gate"):
  # `.github/workflows/release.yml` gates every release on a successful `test`
  # and `e2e` run for the TAG'S EXACT COMMIT, and when there is none it runs
  # this workflow on the tag itself and requires it to pass. That call is a
  # `uses:` at job level, which only works against a workflow that declares
  # `workflow_call`. No inputs and no secrets: the release gate needs this
  # workflow exactly as a push or a dispatch gets it.
  #
  # Two things worth knowing about a call, neither of which changes this file's
  # behaviour for anybody else. A called run inherits the CALLER's ref and
  # event, so `actions/checkout` below checks out the tag and `github.ref` is
  # the tag ref — which is the point, since the gate is asking about the tagged
  # commit. And a called run is not a `test` workflow RUN of its own; its jobs
  # belong to the release run, so the gate's own SHA lookup will never find it
  # afterwards (release.yml's header says what that costs).
  #
  # The `paths-ignore` filters above apply to `push` and `pull_request` only —
  # a call always runs, which is what a release gate needs.
  workflow_call:

# A push to the same PR within a minute cancels the still-running job for the
# earlier push — nobody is waiting on a superseded diff. `main` is excluded
# from cancellation (cancel-in-progress is keyed off the pull_request event
# only): a push there is either the deploy backstop or a wave consolidation
# merge, and cancelling either mid-run would leave the last real signal on
# `main` incomplete.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Wires H3's CI-only Postgres speed layer (docker-compose.ci.yml, decision D5
# in docs/plans/2026-09-harness-optimization.md) into this workflow without
# touching the documented command below: `docker compose` reads COMPOSE_FILE
# instead of an explicit `-f` list, so `docker compose run --rm app go test
# ./...` stays byte-identical to what a developer runs locally, and only the
# merged config differs on a runner. docker-compose.ci.yml is override-style
# (it only adds a tmpfs data dir to `db`) and stays a no-op anywhere this
# variable isn't set.
env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:docker-compose.ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Restores the Go build object cache from a previous run, keyed on
      # go.sum plus the exact commit so every run's primary key is unique
      # (the save below always runs) while restore-keys fall back to the
      # nearest go.sum match, then to any cache for this OS. The path is a
      # plain runner directory, not the named Docker volume itself —
      # actions/cache only knows how to save/restore a filesystem path — so
      # the next step turns that same directory into the volume
      # docker-compose.override.yml already mounts at
      # /root/.cache/go-build, and neither the override file nor the test
      # commands below have to know caching exists.
      #
      # `runner.temp`, not a path under the repo checkout: the dev image's
      # build (below) sends the whole build context (repo root, `COPY . .`)
      # to buildx, and `.dockerignore` does not exclude a `.cache/` directory
      # — a cache under the checkout would ship hundreds of MB of compiled
      # object files into the image and into its own GitHub Actions layer
      # cache every run, the opposite of what this step is for. The issue
      # this package implements names `$PWD/.cache/go-build`; this deviates
      # to `runner.temp` for that reason, noted in the PR body.
      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-

      # docker-compose.override.yml's `go-build-cache` volume is declared
      # `external: true` (its own comment explains why: so a package
      # worktree's own `docker compose down -v` - which Stop-PackageStack in
      # scripts/wellen-orchestrator.ps1 runs the moment its issue closes -
      # never deletes it). Compose refuses to start at all against a missing
      # external volume rather than creating one, and a GitHub-hosted runner
      # is a fresh VM with no volumes on it — so this step has to create it
      # every run, unlike a persistent machine where it is created once.
      # It is created as a *bind* mount onto the directory actions/cache just
      # restored into, rather than a plain Docker-managed volume: a bind is
      # nothing more than a directory Docker mounts by reference, so
      # whatever `go test` writes under it during this job is already sitting
      # in that directory for actions/cache's own post-job save step to pick
      # up — no separate `docker run ... tar` copy step in or out of the
      # volume, and docker-compose.override.yml's mount line is unchanged
      # between a developer's machine (a real named volume) and here.
      - name: Create the external Go build-cache volume (bind-mounted for actions/cache)
        run: |
          mkdir -p "${{ runner.temp }}/go-build"
          docker volume create --driver local \
            --opt type=none --opt o=bind \
            --opt device="${{ runner.temp }}/go-build" \
            inventory-go-build-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the same `dev` target docker-compose.override.yml builds, but
      # through buildx with BuildKit's GitHub Actions cache backend instead
      # of compose's own builder, and loads the result into the runner's
      # local Docker so `docker compose run` below finds an image already
      # tagged `inventory-app-dev:latest` and skips its own build entirely.
      # What the cache actually saves is the `go mod download` layer in the
      # Dockerfile's `dev` stage — `go.sum` unchanged means that layer
      # restores from the GitHub Actions cache instead of re-downloading the
      # whole module graph. `mode=max` caches every layer, not just the
      # final one, which is what makes that specific layer restorable on its
      # own even though later layers (the source `COPY`) always change.
      - name: Build the dev image (BuildKit layer cache via GitHub Actions)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          tags: inventory-app-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non-interactive stand-in for `docker compose run --rm setup`, which
      # needs a TTY. Values are throwaway, generated fresh per run, and never
      # leave this ephemeral runner — not real secrets.
      - name: Write ephemeral .env for the test stack
        run: |
          DB_PASSWORD="ci-$(openssl rand -hex 8)"
          cat > .env <<EOF
          APP_ENV=dev
          HTTP_PORT=8000
          STATIC_DIR=/src/web/static
          POSTGRES_USER=inventory
          POSTGRES_PASSWORD=${DB_PASSWORD}
          POSTGRES_DB=inventory
          DATABASE_URL=postgres://inventory:${DB_PASSWORD}@db:5432/inventory?sslmode=disable
          SESSION_SECRET=ci-$(openssl rand -hex 16)
          ADMIN_INITIAL_USERNAME=admin
          ADMIN_INITIAL_PASSWORD=ci-$(openssl rand -hex 8)
          GEMINI_API_KEY=
          GEMINI_MODEL=gemini-3.6-flash
          GEMINI_IMAGE_MODEL=
          SERPAPI_API_KEY=
          EOF

      # The deterministic pre-gate (H6, docs/plans/2026-09-harness-
      # optimization.md): gofmt, go vet, staticcheck, revive and
      # TestEnvExampleParity, before the full suite below spends time on a
      # PR a linter would have caught in seconds. Same image, same
      # `docker compose run --rm app` as scripts/dev.d/check, so a run here
      # and a local `scripts/dev check` never disagree.
      #
      # `sh scripts/dev check`, not the bare form: scripts/dev and
      # scripts/dev.d/* are committed without the executable bit (H1, #300 -
      # harmless on the Windows/Git-Bash sessions that have run them so far,
      # since neither NTFS nor MSYS enforces it, but a plain exec of the path
      # would hit "Permission denied" on this Linux runner). Tracked as #336
      # rather than fixed here - scripts/dev's own mode bits are outside this
      # issue's file ownership.
      - name: scripts/dev check
        run: sh scripts/dev check

      # One container invocation instead of a separate `run` for `go vet` and
      # for `go test`: each `docker compose run` starts its own copy of the
      # stack and waits on `db`'s healthcheck (docker-compose.yml's
      # `depends_on: db: condition: service_healthy`), so two invocations
      # paid for that wait twice.
      - name: go vet && go test
        run: docker compose run --rm app sh -c 'go vet ./... && go test ./...'

      - name: Tear down
        if: always()
        run: docker compose down -v

  # H16 (docs/specs/38-release-pipeline-and-nas-runner.md, "The runner: a
  # container on the NAS"): build the self-hosted runner's image, and run its
  # start-up smoke test, whenever anything in deploy/synology/runner/ changes -
  # and only then. The runner is the one component nothing else exercises: it is
  # built by hand on the NAS, at most a few times a year, and a base image that
  # dropped a tool or a download URL that moved would otherwise be discovered
  # during a release, by an operator, on the NAS. Spec 38's criterion is "its
  # image is built in CI only when deploy/synology/runner/** changes".
  #
  # Why a job with a path check in it rather than a `paths:` trigger: GitHub's
  # path filters are per WORKFLOW (on.<event>.paths), not per job, so a
  # `paths`-filtered trigger here would have to narrow the whole `test` job
  # above with it. The alternative - a second workflow file - would duplicate
  # this workflow's triggers and its reasons for them. So the filter is a step,
  # and the cost of the narrowing is one runner start (a few seconds) on a
  # change that is not about the runner, which then says so in the log and
  # builds nothing.
  runner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, because the next step diffs against a base commit.
      # The default shallow checkout has neither HEAD~1 nor the PR's base sha.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The path filter. Each event has its own honest answer to "compared with
      # what?", and there is no answer that fits all three:
      #   pull_request     - the PR's base commit: the whole PR is the change.
      #   push             - the commit that was there before the push.
      #   workflow_dispatch - the dispatched commit alone (HEAD~1), which is also
      #                       what makes "does this commit touch the runner?" a
      #                       question you can ask on demand.
      - name: Did deploy/synology/runner/ change?
        id: filter
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            push)         base='${{ github.event.before }}' ;;
            *)            base='' ;;
          esac
          # A new branch's push reports an all-zero "before", and a dispatch
          # reports nothing at all: fall back to the dispatched commit's own
          # parent, and to "build it" when even that does not exist (a root
          # commit).
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              base=$(git rev-parse --verify --quiet HEAD~1) || base= ;;
          esac
          if [ -z "$base" ]; then
            echo "no base commit to compare against - building the runner image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- deploy/synology/runner/ | wc -l)
          echo "base=$base  files changed under deploy/synology/runner/: $changed"
          if [ "$changed" -gt 0 ]; then
            git diff --name-only "$base" HEAD -- deploy/synology/runner/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy/synology/runner/ unchanged - NOT building the runner image"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Plain `docker build`, not buildx with a layer cache: this runs on a
      # handful of commits a year, and the expensive layer (the base image) is
      # pulled either way. It is also the exact command spec 38's criterion and
      # deploy/synology/runner/README.md name, so a green tick here means that
      # command works.
      - name: Build the runner image
        if: steps.filter.outputs.changed == 'true'
        run: docker build -t inventory-runner:local deploy/synology/runner

      # The image's own start-up smoke test, in the mode that registers nothing
      # and takes no job (RUNNER_SMOKE_ONLY=1). This is the part that catches a
      # base image which dropped git or the Docker CLI, or a docker-compose that
      # can no longer parse the app stack's two files - none of which a
      # successful build would notice.
      #
      # The checkout stands in for the clone, mounted at the identical path
      # inside and out, which is what the runner requires on the NAS and what
      # $GITHUB_WORKSPACE happens to make possible here: it is a real path on
      # the same host whose daemon /var/run/docker.sock belongs to.
      - name: Run the runner image's start-up smoke test
        if: steps.filter.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -e "INVENTORY_CLONE=$GITHUB_WORKSPACE" \
            -e RUNNER_SMOKE_ONLY=1 \
            inventory-runner:local

  # H18 (issue #317): build the agent runtime's image (deploy/agent/) and
  # prove its entrypoint refuses to start without being told to, whenever
  # anything in deploy/agent/** changes - and only then. Unlike
  # `runner-image` above, there is no credential-free "smoke only" mode here:
  # this image's own gate IS scripts/doctor, and scripts/doctor's checks span
  # gh/git/claude auth that a public PR run has no business carrying as
  # secrets. So what this job proves is the refusal path itself - with
  # neither the socket nor any credentials mounted, the container must exit
  # non-zero having run nothing else. The "all ok" path (this package's other
  # acceptance criterion) is proved by hand, on the PC, with real
  # credentials, and its output lives in the PR body - see
  # deploy/agent/README.md's own "Verify" section for the exact commands.
  agent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0, because the next step diffs against a base commit.
      # The default shallow checkout has neither HEAD~1 nor the PR's base sha.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The path filter. Same three-event logic as `runner-image`'s own step
      # above (each event's own honest answer to "compared with what?"); see
      # its comment for why.
      - name: Did deploy/agent/ change?
        id: filter
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            push)         base='${{ github.event.before }}' ;;
            *)            base='' ;;
          esac
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              base=$(git rev-parse --verify --quiet HEAD~1) || base= ;;
          esac
          if [ -z "$base" ]; then
            echo "no base commit to compare against - building the agent image"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- deploy/agent/ | wc -l)
          echo "base=$base  files changed under deploy/agent/: $changed"
          if [ "$changed" -gt 0 ]; then
            git diff --name-only "$base" HEAD -- deploy/agent/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy/agent/ unchanged - NOT building the agent image"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Plain `docker build`, not buildx with a layer cache: this changes as
      # rarely as the runner image, and the expensive layers (the base image,
      # the tool downloads) are fetched either way. Also the exact command
      # deploy/agent/README.md names, so a green tick here means that command
      # works.
      - name: Build the agent image
        if: steps.filter.outputs.changed == 'true'
        run: docker build -t inventory-agent:local -f deploy/agent/Dockerfile .

      # The refusal path, with nothing mounted but the checkout itself:
      # neither the Docker socket nor GH_TOKEN/GIT_AUTHOR_*/
      # CLAUDE_CODE_OAUTH_TOKEN are given, so every doctor check that needs
      # them must FAIL and the entrypoint must exit non-zero having started
      # nothing else. `$GITHUB_WORKSPACE` stands in for `$REPO_PATH` - a real
      # path on this host, which is all REPO_PATH needs to be here since
      # nothing nested runs.
      - name: Run the agent image's doctor gate with nothing mounted
        if: steps.filter.outputs.changed == 'true'
        run: |
          set +e
          docker run --rm \
            -e REPO_PATH="$GITHUB_WORKSPACE" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            inventory-agent:local scripts/doctor
          status=$?
          echo "exit status: $status"
          if [ "$status" -eq 0 ]; then
            echo "expected a non-zero exit (no socket, no credentials mounted) but got 0" >&2
            exit 1
          fi
