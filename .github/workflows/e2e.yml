# Runs the E2E deployment gate (docker-compose.e2e.yml,
# docs/specs/05-frontend-pwa-foundations.md) on GitHub-hosted runners.
#
# Deliberately NOT triggered on `pull_request`. E2E is the deployment gate —
# "must pass before promoting an image to production"
# (docs/specs/01-architecture-and-deployment.md) — not a PR merge gate: it is
# slow (a full stack plus a real browser), and review-tests
# (.claude/agents/review-tests.md) already treats E2E journeys as "not
# verified here" rather than requiring them per PR. `test.yml` (go vet + go
# test) DOES run automatically on a PR whose base is `main` (a wave
# consolidation PR, or any other PR merging straight to main) — see its own
# header for why that one is narrower than "never" — but this workflow stays
# off `pull_request` entirely, for either kind of PR, for the reason above,
# not that one. Runs after every push to main (confirming what is about to be
# deployed) and on `workflow_dispatch` for an explicit pre-deploy or debugging
# run. If a PR ever needs its own E2E signal, that is a deliberate
# `workflow_dispatch` call against the PR branch, per the dispatch/poll
# recipe below — never an automatic, merge-blocking run.
#
# Same reasoning as test.yml for why this exists at all: this project is
# docker-only (docs/specs/01-architecture-and-deployment.md), and some
# sandboxes agent sessions run in cannot start a Docker daemon locally
# (issue #48) — so a GitHub-hosted runner, which has one, is the only place
# this suite has ever actually executed. Dispatch and poll it the same way
# test.yml documents (or `scripts/dev ci-status <sha> --workflow e2e.yml
# --dispatch <branch>`, which is this recipe as a command):
#
#   git push -u origin <branch>
#   gh workflow run e2e.yml --ref <branch>
#   SHA=$(git rev-parse HEAD)
#   RUN_ID=""
#   for i in $(seq 1 10); do
#     RUN_ID=$(gh run list --workflow=e2e.yml --branch <branch> --event workflow_dispatch \
#       --limit 5 --json databaseId,headSha -q ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)
#     [ -n "$RUN_ID" ] && break
#     sleep 3
#   done
#   gh run watch "$RUN_ID" --exit-status
#
# Nothing here bypasses the no-host-toolchain rule: every command goes
# through `docker compose` or `docker buildx`/`docker save`/`docker load`,
# which move image bytes around rather than compiling or running project
# code on the runner directly. The Playwright browser runtime lives only in
# the `e2e` service's pulled image, exactly as docker-compose.e2e.yml
# documents — nothing is installed on the runner directly.
#
# Two jobs. `build` builds the production image once
# (docker/build-push-action, same `prod` target docker-compose.e2e.yml's
# `app` service builds) and hands it to `e2e` as a GitHub Actions artifact —
# not a second job in this file for the restore round trip anymore; that
# moved to its own workflow, `restore.yml`, per decision D8 (docs/plans/2026-
# 09-harness-optimization.md §9) once it stopped running on every push. The
# split for the round trip used to be load bearing because each GitHub job
# gets its own runner, so its `down -v` could never reach the suite's stack;
# now that they are two separate *workflows* with independent triggers, that
# isolation is automatic in a stronger way — `restore.yml` mostly does not
# run at all. Both workflows still build from the same Dockerfile and target,
# both use docker-compose.e2e.yml, and a machine still has exactly one E2E
# stack — so locally the two must never run at the same time, and neither may
# run beside another checkout's E2E stack. On CI, separate jobs/workflows on
# separate runners make that automatic.
#
# Hand-over, measured via workflow_dispatch on branch harness/h8-e2e-workflow
# (2026-09-27, same commit's source for both, ubuntu-latest): `docker save` +
# `actions/upload-artifact` — `e2e` job 1m52s–2m3s wall (download+load+verify
# under 4s of that). A pure BuildKit layer cache (`type=gha`, `e2e` rebuilds
# with `cache-from`, no artifact) was measured the same way: it DOES hit
# cache for the `go test && go build` layer (BuildKit's cache is content-
# addressed and the source tree is identical within one commit), but
# restoring the builder stage's cached layers plus buildx setup still cost
# the `e2e` job 4m7s wall — 1m28s slower than an outright cache MISS would
# have added to `build` alone. `docker save`/`upload-artifact` wins by a wide
# margin; run URLs and full step timings are in the PR body. Neither variant
# reaches the issue's ≤3 billed-minute target on its own — `build` alone
# bills a full minute for checkout + buildx setup + the image build, which
# still pays the builder stage's ~51s `go test` (unavoidable without
# touching the Dockerfile, which this package does not own) — flagged for
# Tizian in the PR body; the two-job split is still strictly cheaper than
# the pre-H8 shape, which built the image twice per push.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to `main` supersedes an E2E run already in flight for the
# push before it — nobody is waiting on a superseded deployment gate for a
# commit that is no longer at the tip. `workflow_dispatch` runs are not
# grouped by ref the same way pushes are (two people dispatching the same
# branch back to back is rare and each wants its own answer), so this only
# ever cancels a `push` run with an earlier `push` run, never a dispatched
# debugging run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Builds the same `prod` target docker-compose.e2e.yml's `app` service
  # builds, once, and hands the result to `e2e` as a plain tarball artifact
  # (`docker save`) rather than a second `docker compose build` — see the
  # header above for the measurement that decided this over a shared
  # BuildKit layer cache. `cache-from`/`cache-to: type=gha` still speeds up
  # the parts of the build that DO cache across commits (the `go mod
  # download` layer, keyed on go.sum, same as test.yml's dev-image build).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tagged `inventory-e2e-app:latest` on purpose: that is the name Compose
      # itself would synthesize for docker-compose.e2e.yml's `app` service
      # (`name: inventory-e2e` in that file, no `.env` on a runner to set
      # COMPOSE_PROJECT_NAME and override it — see that file's own header for
      # the measured precedence). `docker compose ... run`/`up` below never
      # rebuild an image that is already present under the tag they expect;
      # they would only silently rebuild it, from scratch, under the SAME
      # tag, if this one were wrong — which is exactly what "Verify the
      # image Compose will actually use" in the `e2e` job below guards
      # against instead of trusting silently.
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          tags: inventory-e2e-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/inventory-e2e-app.tar

      - name: Upload the image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inventory-e2e-app
          path: /tmp/inventory-e2e-app.tar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventory-e2e-app
          path: /tmp

      - name: Load the image
        run: docker load -i /tmp/inventory-e2e-app.tar

      # Loud rather than silent: if `build`'s tag ever drifted from the one
      # Compose synthesizes for this file's `app` service, `run`/`up` below
      # would not fail — they would just rebuild the image themselves, from
      # scratch, under the same tag, quietly throwing away everything `build`
      # did. This step turns that mismatch into a failed job instead.
      - name: Verify the image Compose will actually use is the one just loaded
        run: docker image inspect inventory-e2e-app:latest >/dev/null

      # Migrate, then start — in that order, and not `up -d` first. Since
      # docs/specs/18-operations-and-observability.md, `serve` refuses to
      # start against a schema that is behind the binary, so an `app`
      # container brought up before `migrate up` exits immediately with the
      # remediation message and the suite has nothing to talk to. This is
      # the same order the deployment steps in
      # docs/specs/01-architecture-and-deployment.md have always used. There
      # is no separate "build the images" step here — the image `build`
      # already produced is what these commands find.
      - name: Apply migrations
        run: docker compose -f docker-compose.e2e.yml run --rm app migrate up

      - name: Bring up the stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Seed fixtures
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db \
            psql -U e2e -d e2e -f /fixtures/seed.sql

      # up -d returns once the containers have started, not once the app is
      # actually answering requests — there's no healthcheck on `app` itself
      # (only on `db`, which gates its own startup). /healthz
      # (docs/specs/01-architecture-and-deployment.md) is what actually
      # proves readiness rather than just "Traefik is up": it only answers
      # 200 once the app's own database connection succeeds, unlike a static
      # asset like `/`, which staticHandler serves straight from the
      # embedded frontend tree without touching Postgres at all — a 200
      # there would prove nothing about whether the app can actually serve a
      # request.
      - name: Wait for the app to answer through Traefik
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/healthz || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "app never answered a 200 from /healthz" >&2
          docker compose -f docker-compose.e2e.yml logs app
          exit 1

      # e2e/node_modules cached across runs, keyed on e2e/package.json (not
      # e2e/package-lock.json — .gitignore deliberately keeps that file
      # uncommitted, since `npm install` regenerates it on every invocation
      # of the throwaway Playwright container and it was never meant to
      # persist, same as node_modules itself. package.json IS committed and
      # pins exact versions (its own description comment says so), so it
      # invalidates the cache exactly when a dependency actually changes,
      # which is what the lockfile would have keyed on if one existed here.
      # A cache hit means the `npm install` below has nothing to do — its
      # own output says "up to date" — instead of reinstalling
      # @playwright/test and playwright-core on every run. `npm install`,
      # not `npm ci`, stays the `e2e` service's own entrypoint
      # (docker-compose.e2e.yml) — `npm ci` deletes node_modules before
      # installing, which would throw this cache away on every single run
      # instead of reusing it.
      - name: Restore e2e/node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/node_modules
          key: e2e-node-modules-${{ hashFiles('e2e/package.json') }}

      - name: Run the E2E suite
        run: docker compose -f docker-compose.e2e.yml run --rm e2e

      # Playwright writes traces/screenshots for failed tests under
      # e2e/test-results (playwright.config.js's default outputDir), which
      # is on the bind-mounted ./e2e volume — reachable on the runner's
      # filesystem even though the tests ran inside the container.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/test-results
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
