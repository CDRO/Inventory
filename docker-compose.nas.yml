# Synology NAS variant (docs/specs/01-architecture-and-deployment.md, "Synology
# NAS variant: Tailscale sidecar, bind-mounted data").
#
# Layered ON TOP of docker-compose.yml, so the clone on the NAS never carries a
# local edit that a `git pull` could trip over. Every command on the NAS is
# `docker-compose` (with the hyphen) followed by this prefix, written out in full:
#
#   docker-compose -p inventory -f docker-compose.yml -f docker-compose.nas.yml <arguments>
#
# (deploy/synology/install-shell puts it into your login shell as $DC and `dc`,
# deploy/synology/update runs a safe rolling update, and deploy/synology/compose
# is the prefix as an optional script; nothing here depends on any of them, see
# deploy/synology/README.md.) It does not depend on any untracked file. That is deliberate. An
# explicit -f is the pin the spec calls a security control: it keeps
# docker-compose.override.yml (the dev override: APP_ENV=dev, debug_reason in
# error responses, port 8000 past the ingress) from being merged in. A guard
# that lived in .env would fail open the moment the setup wizard rewrites it.
#
# So on the NAS never run a bare `docker-compose up`, and do not copy the
# command the setup wizard prints at the end: neither has a -f, and both load the
# dev override. The prefix plus `config --services` must list app, db and
# ts-inventory and must not list traefik.
#
# Deviations from the base stack, all deliberate:
#
#  1. Runtime data lives in bind mounts inside the clone (./pgdata, ./uploads,
#     ./imagecache) instead of named volumes. They are gitignored and
#     dockerignored. Compose merges `volumes` by container path, so each entry
#     below replaces the base file's named volume of the same target.
#
#  2. Traefik is switched off. Tailscale (below) is the only ingress, so the app
#     needs no host port at all: nothing to clash with DSM's own 80/443/5000/
#     5001, and the Docker socket is no longer mounted into a container.
#
#  3. Tailscale runs as a sidecar container and publishes the app over HTTPS on
#     the tailnet through `tailscale serve` (deploy/synology/tailscale/serve.json).

services:
  # A profile no one enables. A service cannot be deleted by an override, but a
  # service whose profile is inactive is not started by `up`.
  traefik:
    profiles: ["disabled"]

  app:
    # No container_name here, on purpose: Compose refuses to run two instances of
    # a service that has one, and deploy/synology/update starts a second app
    # instance next to the old one before it retires the old one.
    volumes:
      - ./uploads:/data/uploads
      - ./imagecache:/data/cache

  # Without these two entries the backup would silently archive nothing.
  #
  # Compose merges `volumes` by container path, and the base file points
  # `backup` at the *named* volume `uploads`. On the NAS the real tree is the
  # bind mount ./uploads, so the named volume does not exist — Docker would
  # create it, empty, and tar would happily archive an empty directory: exit 0,
  # an archive that looks right, and every image gone at restore time. The
  # pairing (read-only for backup, writable for restore) matches the base file.
  backup:
    volumes:
      - ./uploads:/data/uploads:ro
      - ./uploads:/restore/uploads

  db:
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  ts-inventory:
    # Unpinned on purpose, like the operator's other Tailscale sidecars;
    # `pull ts-inventory` (with the prefix above) refreshes it.
    image: tailscale/tailscale:latest
    container_name: ts-inventory
    # Shares app's network namespace. If app restarts on its own - including
    # Docker's automatic restart after a crash - this container keeps the dead
    # namespace and the tailnet URL stops answering until it is restarted too:
    #   restart ts-inventory (with the prefix above)
    network_mode: service:app
    environment:
      # Becomes https://inventory.<tailnet>.ts.net (needs MagicDNS and HTTPS
      # certificates enabled for the tailnet).
      TS_HOSTNAME: inventory
      TS_STATE_DIR: /var/lib/tailscale
      # The proxy rule lives in serve.json. `tailscale up` has no --serve flag,
      # so TS_EXTRA_ARGS=--serve=... does not configure anything. The
      # ${TS_CERT_DOMAIN} inside serve.json is expanded by the Tailscale
      # container at start-up to this node's MagicDNS name. It is not a Compose
      # variable, and must not be replaced with a tailnet name.
      TS_SERVE_CONFIG: /config/serve.json
      # Needed only on the very first start; the node identity then persists in
      # ./ts_inventory_state. Pass it on the command line, not in a tracked file:
      #   TS_AUTHKEY=tskey-auth-... docker-compose -p inventory -f docker-compose.yml -f docker-compose.nas.yml up -d
      # It still lands in the shell history and, through interpolation, in this
      # container's configuration (`docker inspect`) until the container is
      # recreated. Use a one-off key with a short expiry, and revoke it if the
      # first start fails. The default keeps `up` quiet when it is unset.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - ./ts_inventory_state:/var/lib/tailscale    # holds the node key: keep it private
      # The directory, not the single file: Tailscale only notices changes to a
      # bind-mounted serve config when the directory is mounted.
      - ./deploy/synology/tailscale:/config:ro
      # NET_ADMIN and the tun device are inherited from the operator's other
      # Tailscale sidecars, not required here: `tailscale serve` runs in the
      # image's default userspace networking, and TS_USERSPACE=false is not set.
      # The operator's NAS has the device. On a NAS without it, Docker would
      # create a directory at this path instead of failing.
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - app
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
