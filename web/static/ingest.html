<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title data-i18n="ingest.pageTitle">Scan photos · Inventory</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/gamification.css">
</head>
<body>
  <header class="shell row row--between">
    <strong data-i18n="common.appName">Inventory</strong>
    <div class="row">
      <div id="storage-switcher" hidden></div>
      <div id="gamification-ring" hidden></div>
      <div id="inbox-link" hidden></div>
      <a href="/storages.html" class="btn btn--ghost" data-i18n="common.back">Back</a>
    </div>
  </header>

  <main id="main" class="shell stack" aria-live="polite">
    <h2 data-i18n="ingest.title">Scan photos</h2>

    <div id="error" class="alert" role="alert" hidden></div>

    <form id="upload-form" class="card stack">
      <!-- The capture mode is chosen before the photo and persists across
           photos, pages and sessions (docs/specs/09-consumption-logging.md):
           a run of many photos in one direction asks zero questions. -->
      <fieldset class="stack">
        <legend data-i18n="ingest.mode.legend">What are you doing?</legend>
        <label class="row"><input type="radio" name="mode" value="stocking_up"> <span data-i18n="ingest.mode.stockingUp">Stocking up — I'm adding this (+)</span></label>
        <label class="row"><input type="radio" name="mode" value="using_up"> <span data-i18n="ingest.mode.usingUp">Using up — I'm removing this (−)</span></label>
        <label class="row"><input type="radio" name="mode" value="shelf_scan"> <span data-i18n="ingest.mode.shelfScan">Shelf scan — index everything visible (+)</span></label>
      </fieldset>

      <div id="location-field" class="field">
        <label for="location" data-i18n="ingest.location.label">Where was it taken? (optional)</label>
        <select id="location">
          <option value="" data-i18n="ingest.location.auto">Let the photo tell</option>
        </select>
      </div>

      <!-- The barcode affordance beside the shutter
           (docs/specs/20-barcode-recall.md). Shown for the two modes that log
           one product at a time; shelf scan has none, because a shelf is not a
           barcode. -->
      <div id="scan-field" class="field" hidden>
        <button id="scan-barcode" type="button" class="btn" data-i18n="ingest.scanBarcode">Scan a barcode</button>
        <p class="muted" data-i18n="ingest.scanBarcodeHint">
          Faster than a photo for anything already scanned once here. Nothing is
          logged until you confirm.
        </p>
      </div>

      <div class="field">
        <label for="photos" data-i18n="ingest.photos.label">Photos</label>
        <!-- capture opens the rear camera on a phone and still allows a
             gallery pick (docs/specs/05-frontend-pwa-foundations.md). -->
        <input id="photos" type="file" accept="image/*" capture="environment" multiple required>
      </div>

      <button id="submit" type="submit" class="btn btn--primary" data-i18n="ingest.upload">Upload</button>
      <p class="muted" data-i18n="ingest.uploadHint">
        Photos are analysed in the background. You can leave this page as soon
        as they are uploaded — the results wait in your inbox.
      </p>
    </form>

    <section id="uploads" class="stack" aria-label="Uploads" data-i18n-aria-label="ingest.uploadsSection"></section>
  </main>

  <template id="upload-template">
    <div class="card stack">
      <div class="row row--between">
        <strong data-role="name"></strong>
        <span class="badge" data-role="status"></span>
      </div>
      <p class="muted" data-role="detail"></p>
      <div class="row" data-role="actions"></div>
    </div>
  </template>

  <script type="module" src="/js/pages/ingest.js"></script>
</body>
</html>
