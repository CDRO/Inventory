<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title data-i18n="inbox.pageTitle">Inbox · Inventory</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/gamification.css">
</head>
<body>
  <header class="shell row row--between">
    <strong data-i18n="common.appName">Inventory</strong>
    <div class="row">
      <div id="storage-switcher" hidden></div>
      <div id="gamification-ring" hidden></div>
      <a href="/storages.html" class="btn btn--ghost" data-i18n="common.back">Back</a>
    </div>
  </header>

  <main id="main" class="shell stack" aria-live="polite">
    <div class="row row--between">
      <h2 data-i18n="inbox.title">Inbox</h2>
      <div class="row">
        <button id="discard-all" type="button" class="btn btn--ghost" hidden data-i18n="inbox.discardAll">Discard all</button>
        <a id="scan-link" class="btn" href="/ingest.html" data-i18n="inbox.scanPhotos">Scan photos</a>
      </div>
    </div>

    <div id="notice" class="alert alert--success" role="status" hidden></div>
    <div id="error" class="alert" role="alert" hidden></div>

    <div id="jobs" class="stack"></div>
    <button id="more" type="button" class="btn btn--ghost" hidden data-i18n="inbox.showOlder">Show older</button>
  </main>

  <template id="job-template">
    <div class="card job-card">
      <img class="job-card__thumb" data-role="thumb" alt="" hidden>
      <div class="stack">
        <div class="row row--between">
          <strong data-role="kind"></strong>
          <span class="badge" data-role="status"></span>
        </div>
        <p class="muted" data-role="detail"></p>
        <div class="row" data-role="actions"></div>
      </div>
    </div>
  </template>

  <script type="module" src="/js/pages/inbox.js"></script>
</body>
</html>
