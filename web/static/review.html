<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Review · Inventory</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="shell row row--between">
    <strong>Inventory</strong>
    <div class="row">
      <div id="storage-switcher" hidden></div>
      <a id="back" href="/inbox.html" class="btn btn--ghost">Inbox</a>
    </div>
  </header>

  <main id="main" class="shell stack" aria-live="polite">
    <h2>Review</h2>

    <div id="error" class="alert" role="alert" hidden></div>
    <p id="status" class="empty-state">Loading…</p>

    <section id="proposal" class="stack" hidden>
      <p class="muted">
        Nothing is added to your inventory until you confirm. Reject anything
        that is not really there; correct anything the photo got wrong.
      </p>
      <div id="rows" class="review-list"></div>
      <div class="row">
        <button id="confirm" type="button" class="btn btn--primary">Confirm</button>
        <button id="discard" type="button" class="btn btn--ghost">Discard</button>
      </div>
    </section>
  </main>

  <!-- One proposed row. Every value from the model or the catalog goes in
       through textContent or a form control's value, never as markup. -->
  <template id="row-template">
    <div class="review-row">
      <div class="review-crop" data-role="crop" role="img"></div>
      <div class="review-row__fields">
        <div class="row row--between">
          <strong data-field="label"></strong>
          <span class="badge" data-role="confidence"></span>
        </div>

        <div class="field">
          <label>Product
            <select data-role="product"></select>
          </label>
        </div>
        <div class="field" data-role="new-product" hidden>
          <label>New product name
            <input type="text" data-role="new-product-name" maxlength="255">
          </label>
          <label>Kind
            <select data-role="item-type">
              <option value="long_shelf_life">Keeps a long time</option>
              <option value="perishable">Perishable</option>
              <option value="non_perishable">Does not expire</option>
            </select>
          </label>
        </div>

        <div class="row">
          <div class="field">
            <label>Quantity
              <input type="number" data-role="quantity" min="1" step="1" inputmode="numeric">
            </label>
          </div>
          <div class="field">
            <label>Location
              <select data-role="location"></select>
            </label>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Expires
              <input type="date" data-role="expiry">
            </label>
          </div>
          <label class="row"><input type="checkbox" data-role="no-expiry"> Does not expire</label>
        </div>
        <p class="muted" data-role="expiry-hint">Leave the date empty to use the usual shelf life for this product.</p>

        <p class="review-row__error" data-role="row-error" role="alert" hidden></p>
      </div>
      <div class="review-row__actions">
        <button type="button" class="btn btn--ghost" data-action="accept">Accept</button>
        <button type="button" class="btn btn--ghost" data-action="correct">Correct</button>
        <button type="button" class="btn btn--ghost" data-action="reject">Reject</button>
      </div>
    </div>
  </template>

  <script type="module" src="/js/pages/review.js"></script>
</body>
</html>
