<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title data-i18n="review.pageTitle">Review · Inventory</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/gamification.css">
</head>
<body>
  <header class="shell row row--between">
    <strong data-i18n="common.appName">Inventory</strong>
    <div class="row">
      <div id="storage-switcher" hidden></div>
      <div id="gamification-ring" hidden></div>
      <a id="back" href="/inbox.html" class="btn btn--ghost" data-i18n="review.backToInbox">Inbox</a>
    </div>
  </header>

  <main id="main" class="shell stack" aria-live="polite">
    <h2 data-i18n="review.title">Review</h2>

    <div id="error" class="alert" role="alert" hidden></div>
    <p id="status" class="empty-state" data-i18n="common.loading">Loading…</p>

    <section id="proposal" class="stack" hidden>
      <p class="muted" data-i18n="review.hint">
        Nothing is added to your inventory until you confirm. Reject anything
        that is not really there; correct anything the photo got wrong.
      </p>
      <div id="rows" class="review-list"></div>
      <div class="row">
        <button id="confirm" type="button" class="btn btn--primary" data-i18n="review.confirm">Confirm</button>
        <button id="reanalyze" type="button" class="btn btn--ghost" hidden data-i18n="review.reanalyze">Analyze again</button>
        <button id="discard" type="button" class="btn btn--ghost" data-i18n="review.discard">Discard</button>
      </div>
    </section>
  </main>

  <!-- One proposed row. Every value from the model or the catalog goes in
       through textContent or a form control's value, never as markup. -->
  <template id="row-template">
    <div class="review-row">
      <div class="review-crop" data-role="crop" role="img"></div>
      <div class="review-row__fields">
        <div class="row row--between">
          <strong data-field="label"></strong>
          <span class="badge" data-role="confidence"></span>
        </div>

        <div class="field">
          <label><span data-i18n="review.row.product">Product</span>
            <select data-role="product"></select>
          </label>
        </div>
        <div class="field" data-role="new-product" hidden>
          <label><span data-i18n="review.row.newProductName">New product name</span>
            <input type="text" data-role="new-product-name" maxlength="255">
          </label>
          <label><span data-i18n="review.row.kind">Kind</span>
            <select data-role="item-type">
              <option value="long_shelf_life" data-i18n="review.row.kind.longShelfLife">Keeps a long time</option>
              <option value="perishable" data-i18n="review.row.kind.perishable">Perishable</option>
              <option value="non_perishable" data-i18n="review.row.kind.nonPerishable">Does not expire</option>
            </select>
          </label>
          <label><span data-i18n="review.row.category">Category</span>
            <select data-role="new-product-category"></select>
          </label>
          <button type="button" class="btn btn--ghost" data-role="new-product-category-add" data-i18n="review.row.newCategory">+ New category</button>
          <!-- Offered, never preselected: a picture of someone's shelf only
               becomes a product picture when they choose it. -->
          <label data-role="new-product-image-field"><span data-i18n="review.row.picture">Picture</span>
            <select data-role="new-product-image">
              <option value="" data-i18n="review.row.picture.none">No picture</option>
              <option value="crop" data-i18n="review.row.picture.crop">This item, cut from the photo</option>
              <option value="photo" data-i18n="review.row.picture.wholePhoto">The whole photo</option>
            </select>
          </label>
          <!-- Background removal: offered only once a picture from the photo
               is chosen, and only when the server says it can be done. The
               original stays chosen until the other one is picked. -->
          <div class="stack" data-role="cutout" hidden>
            <button type="button" class="btn btn--ghost" data-role="cutout-request" data-i18n="review.row.removeBackground">Remove background</button>
            <p class="muted" data-role="cutout-status" role="status" hidden></p>
            <div class="cutout-compare" data-role="cutout-compare" hidden>
              <label class="cutout-choice">
                <span class="review-crop" data-role="cutout-original" role="img" data-i18n-aria-label="review.row.originalPictureAlt" aria-label="Original picture"></span>
                <span><input type="radio" data-role="cutout-keep" value="original" checked> <span data-i18n="review.row.original">Original</span></span>
              </label>
              <label class="cutout-choice">
                <img class="review-crop cutout-image" data-role="cutout-image" alt="The picture without its background">
                <span><input type="radio" data-role="cutout-keep" value="cutout"> <span data-i18n="review.row.withoutBackground">Without background</span></span>
              </label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label><span data-i18n="review.row.quantity">Quantity</span>
              <input type="number" data-role="quantity" min="1" step="1" inputmode="numeric">
            </label>
          </div>
          <div class="field">
            <label><span data-i18n="review.row.location">Location</span>
              <select data-role="location"></select>
            </label>
            <button type="button" class="btn btn--ghost" data-role="location-add" data-i18n="review.row.newLocation">+ New location</button>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label><span data-i18n="review.row.expires">Expires</span>
              <input type="date" data-role="expiry">
            </label>
          </div>
          <label class="row"><input type="checkbox" data-role="no-expiry"> <span data-i18n="review.row.noExpiryCheckbox">Does not expire</span></label>
        </div>
        <p class="muted" data-role="expiry-hint" data-i18n="review.row.expiryHint">Leave the date empty to use the usual shelf life for this product.</p>

        <p class="review-row__error" data-role="row-error" role="alert" hidden></p>
      </div>
      <div class="review-row__actions">
        <button type="button" class="btn btn--ghost" data-action="accept" data-i18n="review.row.accept">Accept</button>
        <button type="button" class="btn btn--ghost" data-action="correct" data-i18n="review.row.correct">Correct</button>
        <button type="button" class="btn btn--ghost" data-action="reject" data-i18n="review.row.reject">Reject</button>
      </div>
    </div>
  </template>

  <script type="module" src="/js/pages/review.js"></script>
</body>
</html>
