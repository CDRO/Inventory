<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title data-i18n="common.appName">Inventory</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="shell row row--between">
    <strong data-i18n="common.appName">Inventory</strong>
    <!-- No storage switcher, inbox badge or progress ring here: this page
         renders only the storage picker and the zero-storage empty state
         (docs/specs/34-navigation-and-start-page.md), and neither has a
         resolved storage to show any of them for. Log out stays, because it
         is the only one on a page that renders no navigation bar. -->
    <div class="row">
      <button id="logout" type="button" class="btn btn--ghost" data-i18n="common.logout">Log out</button>
    </div>
  </header>

  <main id="main" class="shell" aria-live="polite">
    <p class="empty-state" data-i18n="common.loading">Loading…</p>
  </main>

  <script type="module" src="/js/pages/storages.js"></script>
</body>
</html>
