# The E2E deployment gate (docs/specs/05-frontend-pwa-foundations.md).
#
# Brings up the full stack — traefik, app, db — against a disposable
# database, and runs the browser suite from a pulled Playwright image. Run
# explicitly and on demand, never as part of the dev loop or the image build.
#
# Build, migrate, then start — in that order. `serve` refuses to start against
# a schema behind the binary (docs/specs/18-operations-and-observability.md),
# so an `app` container brought up before `migrate up` exits immediately and
# the suite has nothing to talk to. `-p inventory-e2e` is part of every
# command rather than decoration: in a checkout whose .env sets
# COMPOSE_PROJECT_NAME — every agent worktree — it is the only thing that
# keeps this stack out of that checkout's dev project, because `name:` below
# loses to it. See `name:`'s own comment for the measurements (#190).
#
# ## Locally, run the gate through `scripts/dev e2e`
#
#   scripts/dev e2e            claim the gate and run the whole sequence
#   scripts/dev e2e status     who holds it, and whether a suite is really running
#   scripts/dev e2e break-lock release a lock whose holder is gone
#   scripts/dev e2e down       tear down this checkout's stack and release the lock
#
# That command (`scripts/dev.d/e2e`, whose header carries the measurements) is
# how a local run happens now, and the seven compose lines this header used to
# ask a session to paste by hand are the sequence it performs. It exists
# because pasting them could not be done safely:
#
#   * It takes a real lock first (#389). The `docker ps` pre-flight this
#     header used to prescribe was a check-then-act race with a minutes-wide
#     window — the next command is `down -v`, and a build, a `git` sequence or
#     a Go suite run happens in between — so two checkouts could both pass it
#     and then destroy each other's stack. Measured: the single project ended
#     up holding containers from two working directories at once, after which
#     neither session could safely operate it. **The pre-flight below is
#     evidence, not protection; the lock is the protection.**
#   * It tears the stack down on the way out whatever happens (#377), from a
#     trap on EXIT/INT/TERM rather than as a last line a session can stop
#     before.
#   * It refuses with a reason, naming which kind of refusal it is: a live run
#     to wait for, or a lock with nothing behind it to break. See "the
#     teardown obligation" below.
#   * It builds and runs under an image tag derived from the checkout (#391,
#     the `image:` key on `app`), and checks the served `/js/*` against
#     web/shell-manifest.json before trusting a single test result.
#   * It caps the worker count, which Playwright would otherwise size from the
#     machine's CPUs — CI-shaped on a developer box that is also running five
#     other compose projects (#382).
#
# ## The teardown obligation
#
# **A session that brings this stack up owes it a `down -v`, and the gate is
# not free again until that has run.** This used to be the last line of the
# sequence, which meant a session that stopped early — finished its work, was
# interrupted, crashed — simply never reached it. Measured (#377): a finished
# session's containers stayed `Up` and `healthy` for over half an hour while
# the next checkout waited, reading them as an active run, because existence
# was all the pre-flight could report. `scripts/dev e2e` discharges the
# obligation for you; if you run the raw commands below instead, it is yours.
#
# Note that the orchestrator's own Docker cleanup does NOT cover this
# (scripts/wellen-docker-cleanup.ps1): it deliberately refuses to sweep a
# project with a container outside the wave's worktrees, which the shared
# `inventory-e2e` project always is.
#
# ## The raw sequence, for CI and for debugging
#
# .github/workflows/e2e.yml and restore.yml run these directly and should keep
# doing so — a runner has one checkout, one job, no other compose project and
# no `.env`, so none of the problems above exist there. Run them by hand
# locally only when you are deliberately stepping through a failure, and know
# that doing so takes NO lock and discharges NO teardown:
#
#   docker ps -a --filter label=com.docker.compose.project=inventory-e2e \
#     --format '{{.Names}} {{.Label "com.docker.compose.project.working_dir"}} {{.Status}}'
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml build
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml run --rm app migrate up
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml up -d
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml exec -T db \
#     psql -U e2e -d e2e -f /fixtures/seed.sql
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml run --rm e2e
#   docker compose -p inventory-e2e -f docker-compose.e2e.yml down -v
#
# The first line is the old pre-flight. It is still worth reading — it says
# who else has containers here — but it is not a guard: it reports existence
# after the fact, and `scripts/dev e2e status` reports the same list plus the
# three things that actually distinguish a live run from a leftover (is there
# a container for the `e2e` service at all, has `app` logged anything lately,
# what does the holder's own worklog say). The format prints status alongside
# the name for a reason (#358): a traefik container stuck in `Created` with a
# non-zero exit code — the shape left behind by a failed `up` — is a broken
# leftover, not a run in progress, and plain `docker ps` (no `-a`) would hide
# it entirely while `app`/`db` sat there `Up ... (healthy)`.
#
# The `backup` service below belongs to the second thing this file drives: the
# backup/restore round trip (docs/specs/15-backup-restore-and-export.md, issue
# #133), run by .github/workflows/restore.yml's `restore-round-trip` job
# (moved there from e2e.yml by H8, decision D8). It
# destroys this project's volumes half way through, on purpose, so it must
# never run beside another session's E2E stack — a machine has a single E2E
# project, shared by every checkout on it (`name:` below), and a `down -v` here
# takes that other stack with it. On CI each job gets its own runner, so the
# two are already isolated; locally, run one or the other, never both at once.
#
# One more local caveat, which is about the worktrees rather than about this
# file: an agent worktree's .env sets COMPOSE_PROJECT_NAME, and that beats
# `name:` below — so a command that omits `-p inventory-e2e` there puts this
# file and docker-compose.yml in one project, and the `uploads` volume both
# declare is then one volume, so a round trip destroys the dev stack's uploads
# along with its own. With `-p inventory-e2e`, which every documented command
# above passes, the two are separate volumes in separate projects, exactly as
# they always are on CI, where there is no .env at all.
#
# This does not violate the no-host-toolchain rule
# (docs/specs/01-architecture-and-deployment.md): the Playwright image is
# pulled from a registry, nothing is installed on the host, and the
# application image — built from the same Dockerfile as production — still
# contains no Node.js. The browser runtime exists only inside the `e2e`
# service, and only while tests run.
#
# External services (Gemini/SerpAPI/Iconify) are not stubbed here yet: no code
# in the repository calls any of them. A local fake for that arrives with
# specs 06/07, which are what actually need one.
#
# `name:` below pins an isolated Compose project — but only where nothing else
# names the project, which is why every command above also passes
# `-p inventory-e2e`. Compose's precedence is `-p`, then COMPOSE_PROJECT_NAME
# from the environment or an auto-loaded `.env`, then a file's `name:`, then
# the directory name; and `.env` is read from the project directory whatever
# `-f` says. So what this file is named depends on the checkout it runs from.
# Measured with real `up`s rather than `config` (#190):
#
#   * Main checkout, or any clone with no `.env`: `inventory-e2e`. `name:`
#     stands, and it is load bearing — without it this file would share the
#     default "inventory" project with docker-compose.yml/override.yml, and
#     Compose recreates containers by name across configs, so `db` here would
#     reuse the dev stack's own `inventory-db-1` and its data directory
#     instead of starting fresh, silently defeating the "disposable by
#     definition" anonymous volume below.
#   * An agent worktree, whose `.env` sets COMPOSE_PROJECT_NAME
#     (scripts/wellen-orchestrator.ps1, Set-WorktreeEnvOverrides): `name:`
#     LOSES, and the stack lands in that worktree's own dev project. Not
#     merely a naming wart — the collision above is then live in the place
#     the suite is most often run from. Reproduced: with the worktree's dev
#     `db` container present (every `docker compose run --rm app go test`
#     leaves one behind), `up -d db` from this file recreated it and carried
#     the dev `pgdata` volume onto the new container, so the data directory
#     was already initialized under the dev role and `psql -U e2e` answered
#     `role "e2e" does not exist`.
#   * Either checkout with `-p inventory-e2e`: `inventory-e2e`, a fresh
#     anonymous data directory, and the checkout's own dev stack untouched.
#
# The deliberate answer is therefore: ONE E2E project per machine, always
# named `inventory-e2e`. It is not isolated per worktree and is not meant to
# be — `-p` makes the name the same everywhere instead, and `name:` covers the
# checkouts that pass no `-p` and set no COMPOSE_PROJECT_NAME (CI above all),
# where it is the whole of the separation.
#
# One project per machine means two checkouts may NEVER run the E2E suite at
# the same time. That is a rule, not a preference, and nothing Docker does
# enforces it on its own: under the one shared project name a second `up` does
# not fail at all, it recreates the first stack's containers and takes it over
# silently, and a `down -v` then destroys a run that is still in progress.
# (Before #358 `traefik` published a fixed host port, which incidentally
# refused a second stack under a *different* project name — a case that does
# not arise here, since every documented command passes `-p inventory-e2e` —
# so losing it cost this rule nothing it was actually relying on.)
#
# What enforces it is `scripts/dev e2e`'s lock: a Docker network named
# `inventory-e2e-gate-lock`, claimed with `docker network create`, which the
# daemon refuses to create twice (measured on Docker 27.4.0 — the second
# create exits 1). So the claim is atomic, which the pre-flight `docker ps -a`
# never was; that command reports existence after the fact and cannot see a
# run that starts ten seconds later. A lock is held for the duration of a run
# and released by the teardown, and a stale one is broken deliberately with
# `scripts/dev e2e break-lock`. Inside a sequential wave only one session runs
# at a time and none of this is exercised; a wave with `"sequential": false`
# has several at once, and the lock is what stands between them.
name: inventory-e2e

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
    # No `ports:` (#358) — nothing outside this compose project needs to
    # reach traefik. The `e2e` service below already talks to it by service
    # name over the project's own compose network (BASE_URL=https://traefik),
    # and CI's healthz wait does the same through a throwaway container on
    # that network instead of through the host. Publishing a fixed host port
    # here used to collide silently with an ordinary dev stack in the very
    # worktree running the gate, not just with another checkout's E2E run.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    build:
      context: .
      target: prod
    # The built image's tag, per checkout rather than per machine (#391).
    #
    # Without an explicit `image:`, Compose synthesizes `<project>-<service>`
    # — `inventory-e2e-app` — from the project name, which is deliberately the
    # same on every checkout of this machine (see the header). So a second
    # checkout's `build` replaced the binary and the embedded `web/static`
    # under a stack the first was about to run, WITHOUT touching a single
    # container: every container could be yours, healthy, labelled with your
    # own working_dir, and still serve somebody else's frontend. Measured
    # during the wave-16 consolidation: four of that wave's own new tests
    # failed with exactly the message its unfixed source produces, which is
    # what an adversarial reviewer reads as a blocking finding.
    #
    # `scripts/dev e2e` sets E2E_APP_IMAGE to a tag derived from the
    # checkout's own path, so two checkouts cannot share one built image even
    # if they do share the project name. The DEFAULT is the exact tag Compose
    # would have synthesized, so nothing that sets no variable changes
    # behaviour — .github/workflows/e2e.yml and restore.yml both build
    # `inventory-e2e-app:latest` by hand and then check that this file
    # resolves to what they loaded, and a runner has one checkout anyway.
    image: ${E2E_APP_IMAGE:-inventory-e2e-app:latest}
    environment:
      # A fixed, non-production configuration for a throwaway database.
      # APP_ENV=prod deliberately — the E2E suite validates the deployment
      # posture (debug_reason hidden, 404-not-403), not the dev-friendly one.
      - APP_ENV=prod
      - DATABASE_URL=postgres://e2e:e2e@db:5432/e2e?sslmode=disable
      - SESSION_SECRET=e2e-fixture-session-secret-not-for-real-use
      - ADMIN_INITIAL_USERNAME=e2e-admin
      - ADMIN_INITIAL_PASSWORD=e2e-fixture-password
      - GEMINI_API_KEY=e2e-fixture-unused-key
    volumes:
      # The uploads tree as a named volume rather than the container's own
      # writable layer, because the restore round trip
      # (.github/workflows/restore.yml's `restore-round-trip` job, issue #133)
      # has to destroy it with `down -v` and get it back out of an archive — which
      # a container layer cannot demonstrate, since it is recreated empty
      # either way. docker-compose.yml mounts uploads on `app` exactly like
      # this, so the E2E stack is now a truer copy of the stack spec 15's
      # restore procedure actually targets.
      #
      # imagecache stays deliberately absent. It is not in a backup archive
      # (docs/specs/15-backup-restore-and-export.md) and no E2E journey needs
      # it, so giving it a volume here would only invite a round trip that
      # asserts something the archive never promised.
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # HTTPS only, on Traefik's own auto-generated self-signed default
      # certificate (no certresolver, no cert files — Traefik v3 always has
      # one to fall back to). Service workers, and every other
      # secure-context-gated browser API, are unavailable over plain HTTP
      # unless the origin is literally "localhost" — which a Docker service
      # name never is. `--unsafely-treat-insecure-origin-as-secure` is the
      # documented Chromium flag for the plain-HTTP case, and it was tried
      # first; verified live via a raw Playwright script (bypassing this
      # compose file and playwright.config.js entirely) that it does not
      # make `window.isSecureContext` true in this Playwright/Chromium
      # build, with or without `channel: "chromium"`. Real HTTPS, even on an
      # untrusted cert accepted via Playwright's ignoreHTTPSErrors, is what
      # actually works.
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.services.app.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    # Speed flags for a throwaway database (docs/plans/2026-09-harness-
    # optimization.md, decision D5). This database is already destroyed on
    # every `down -v` (see the anonymous-volume comment below), so trading
    # crash durability for write speed costs nothing this stack keeps:
    # fsync=off and full_page_writes=off mean a host crash or power loss can
    # lose or corrupt recent writes instead of losing nothing, and
    # synchronous_commit=off means any crash can lose the last commit window
    # - none of which this database survives a `down -v` for anyway. Kept in
    # step with docker-compose.override.yml's own copy of the same flags.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    # No named volume for the data directory itself: an E2E database is
    # disposable by definition. An anonymous volume is torn down with the
    # container instead of persisting — reusing a stale fixture across runs,
    # or colliding with the dev pgdata volume, would both be worse than
    # losing the data on every `down`.
    #
    # `down` is what makes that true, though, not `up`: when Compose recreates
    # a container in place it carries the previous one's volume over at a
    # mount point the new definition does not declare. So a bare `up` after an
    # earlier run — or from a second checkout, since the project name is the
    # same one everywhere (see the header) — inherits that run's data
    # directory rather than starting fresh; measured, same anonymous volume id
    # before and after. Beginning the documented sequence with `down -v` is
    # what actually guarantees a clean database, and it is the same reason
    # re-running the suite without one is not idempotent
    # (docs/specs/01-architecture-and-deployment.md, "Running the E2E suite").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Whole-instance backup and restore, for the restore round trip
  # (docs/specs/15-backup-restore-and-export.md, issue #133,
  # .github/workflows/restore.yml). Under the same `tools` profile as `e2e`,
  # so `up -d` never starts it.
  #
  # A deliberate copy of docker-compose.yml's `backup` service — same image,
  # same entrypoint, the same three mounts, and the same deliberate absence of
  # `depends_on: db` — differing in exactly one thing: where the credentials
  # come from. The E2E stack has no .env, so POSTGRES_* are set inline to the
  # same throwaway values `db` above already uses. docker-compose.yml is the
  # original; keep the two in step when either changes.
  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/inventory-backup"]
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    volumes:
      - ./scripts/backup:/usr/local/bin/inventory-backup:ro
      # The uploads volume twice, for the reason docker-compose.yml gives: a
      # backup reads the tree through the read-only mount and so cannot damage
      # it, a restore gets a separate writable path for that one job.
      - uploads:/data/uploads:ro
      - uploads:/restore/uploads
      - ./backups:/backups
    profiles: ["tools"]

  e2e:
    image: mcr.microsoft.com/playwright:v1.48.0-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      - BASE_URL=https://traefik
    depends_on:
      - app
    # `npm install` runs on every invocation rather than baking @playwright/test
    # into a custom image: the Playwright image is the throwaway artifact the
    # spec asks for, and e2e/package.json pins the exact version — matching
    # the image tag above — so the browser binaries already in the image and
    # the test runner installed here stay in lockstep without a Dockerfile of
    # our own to maintain. (An earlier version of this tried `npx -p
    # @playwright/test@1.48.0 playwright test`: npx installs into its own
    # isolated cache, which playwright.config.js's `import "@playwright/test"`
    # cannot see, so the config failed to load. `npm install` puts the package
    # in /e2e/node_modules, where Node's normal resolution actually looks.)
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund && npx playwright test --config=/e2e/playwright.config.js"]
    profiles: ["tools"] # only runs when invoked explicitly, like `setup`

# The uploads tree, shared by `app` (which writes it) and `backup` (which
# archives and restores it). Named rather than anonymous on purpose: the
# restore round trip destroys it with `down -v` and then has to see it come
# back out of the archive, and only a volume the compose file names is one
# `down -v` reliably removes. The database's own data directory stays
# anonymous, for the reason the `db` service's comment gives.
volumes:
  uploads:
